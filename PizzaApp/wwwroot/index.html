<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PizzaApp</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/entrance.css" />
    <link rel="stylesheet" href="PizzaApp.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Startar PizzaApp…</div>

    <div id="entrance" class="entrance" hidden>
        <div class="entrance-scene" aria-hidden="true">
            <div class="entrance-wall">
                <div class="entrance-sign"><strong>Benders dörr</strong><small>Pizza-appen</small></div>
                <div class="entrance-doorway">
                    <div class="entrance-interior"></div>
                    <div class="entrance-door">
                        <div class="entrance-window"><span>Välkommen in</span></div>
                        <div class="entrance-panel"></div>
                        <div class="entrance-handle"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="entrance-caption" role="status">Välkommen in till dagens lunch.</div>
        <button id="entrance-skip" class="entrance-skip" type="button">Hoppa över <span aria-hidden="true">→</span></button>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/entrance.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
