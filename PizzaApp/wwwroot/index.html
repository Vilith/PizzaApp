<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Benders dörr – Pizza-appen</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/entrance.css" />
    <link rel="stylesheet" href="PizzaApp.styles.css?v=menu-tabs-2" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app"><p class="startup-message" role="status">Startar Pizza-appen…</p></div>
    <noscript>Aktivera JavaScript i webbläsaren för att använda Pizza-appen.</noscript>

    <div id="entrance" class="entrance" hidden>
        <div class="entrance-scene" aria-hidden="true">
            <div class="entrance-wall">
                <div class="entrance-sign"><strong>Benders dörr</strong><small>Pizza-appen</small></div>
                <div class="entrance-doorway">
                    <div class="entrance-interior"></div>
                    <div class="entrance-door">
                        <div class="entrance-window"><span>Välkommen in</span></div>
                        <div class="entrance-panel"></div>
                        <div class="entrance-handle"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="entrance-caption" role="status">Välkommen in till dagens lunch.</div>
        <button id="entrance-skip" class="entrance-skip" type="button">Hoppa över <span aria-hidden="true">→</span></button>
    </div>

    <div id="blazor-error-ui">
        Något gick fel. Ladda om sidan och logga in igen.
        <a href="" class="reload">Ladda om</a>
        <button class="dismiss" type="button" aria-label="Stäng felmeddelandet">×</button>
    </div>

    <script src="js/entrance.js"></script>
    <script src="js/order-page.js?v=3"></script>
    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
